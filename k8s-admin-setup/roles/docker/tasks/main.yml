#docker roles/docker/tasks/main.yml

---
- name: Update system packages
  yum:
    name: "*"
    state: latest

- name: Install Git
  yum:
    name: git
    state: present

- name: Enable Amazon Corretto 17
  shell: amazon-linux-extras enable corretto17
  args:
    creates: /etc/yum.repos.d/amzn2-extras.repo

- name: Install Java 17 (Amazon Corretto)
  yum:
    name: java-17-amazon-corretto
    state: present

- name: Enable Docker
  shell: amazon-linux-extras enable docker
  args:
    creates: /etc/yum.repos.d/amzn2-extras.repo

- name: Install Docker
  yum:
    name: docker
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add ec2-user to docker group
  user:
    name: ec2-user
    groups: docker
    append: yes

- name: Add Docker alias to ec2-user .bashrc
  lineinfile:
    path: /home/ec2-user/.bashrc
    line: "alias docker='sudo docker'"
    state: present
    create: yes
    owner: ec2-user
    group: ec2-user

- name: Reload bashrc
  shell: source /home/ec2-user/.bashrc
  args:
    executable: /bin/bash

